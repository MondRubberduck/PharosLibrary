name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      # one failing leg must never cancel the others: a py3.10
      # SyntaxError once fail-fast-cancelled every other job and "CI
      # green" stayed unverifiable for 20+ consecutive runs
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # the MCP check must really run here: a missing mcp package FAILS
      # instead of printing SKIP (a check that can't fail is a bug)
      PHAROS_REQUIRE_MCP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the optional MCP package (for the MCP server check)
        run: python -m pip install "mcp<2"
      # ONE test file per step: on windows the default shell is pwsh, where
      # only the LAST native command of a multi-line run block sets the
      # step's exit code -- earlier suites could fail invisibly
      - name: Unit tests (db schema round-trip)
        run: python -B tests/test_db.py
      - name: Unit tests (uasset parser)
        run: python -B tests/test_uasset_parser.py
      - name: Pipeline regression checks
        run: python -B tests/test_pack_verify.py
      - name: Fresh-install smoke (init -> importers -> API -> scanner -> docs)
        run: python -B tests/test_fresh_install.py

  blender:
    # scene_builder regression checks INSIDE Blender: build, save, reopen
    # headless, assert (tests/blender_scene_checks.py). Pinned to the same
    # Blender release the builder is verified against locally.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_VERSION: "5.1.0"
    steps:
      - uses: actions/checkout@v4
      - name: Cache the Blender tarball (~400 MB; downloaded on a miss only)
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ~/blender-dl
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender-dl
          curl -fsSL --retry 3 -o ~/blender-dl/blender.tar.xz \
            "https://download.blender.org/release/Blender5.1/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
      - name: Unpack Blender and export BLENDER_EXE
        run: |
          mkdir -p "$RUNNER_TEMP/blender"
          tar -xJf ~/blender-dl/blender.tar.xz -C "$RUNNER_TEMP/blender" --strip-components=1
          echo "BLENDER_EXE=$RUNNER_TEMP/blender/blender" >> "$GITHUB_ENV"
      - name: X/GL runtime libraries for headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 libgl1 libegl1
      # --python-exit-code 1 is mandatory: without it a script error exits 0
      - name: scene_builder checks inside Blender
        run: '"$BLENDER_EXE" --background --factory-startup --python-exit-code 1 --python tests/blender_scene_checks.py'
