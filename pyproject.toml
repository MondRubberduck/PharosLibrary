[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharos"
version = "0.9.0"
description = "Local asset-intelligence server for coding agents: indexes 3D meshes, PBR textures, audio and animation clips into a queryable SQLite registry served over HTTP and MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Pharos Contributors" }]

[project.optional-dependencies]
# stdio MCP server (see docs/MCP_SETUP.md)
mcp = ["mcp<2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[tool.setuptools]
package-dir = { "" = "service" }
packages = ["asset_service"]
include-package-data = true

[tool.setuptools.package-data]
# the dashboard is dead without these (templates + vendored three.js)
asset_service = ["templates/*.html", "static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
