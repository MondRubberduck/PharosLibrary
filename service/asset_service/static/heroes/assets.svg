<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#0d1016"/>
    </linearGradient>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c313a"/><stop offset="1" stop-color="#1b1f27"/>
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <g stroke="#1b1f27" stroke-width="2">
    <!-- isometric crate stack -->
    <g transform="translate(330,150)">
      <polygon points="0,60 90,105 180,60 90,15" fill="#3a4250"/>
      <polygon points="0,60 0,150 90,195 90,105" fill="url(#box)"/>
      <polygon points="180,60 180,150 90,195 90,105" fill="#232833"/>
    </g>
    <g transform="translate(470,210)">
      <polygon points="0,50 75,88 150,50 75,12" fill="#465061"/>
      <polygon points="0,50 0,125 75,163 75,88" fill="url(#box)"/>
      <polygon points="150,50 150,125 75,163 75,88" fill="#282e39"/>
    </g>
    <g transform="translate(560,130)">
      <polygon points="0,40 60,72 120,40 60,8" fill="#3a4250"/>
      <polygon points="0,40 0,100 60,132 60,72" fill="url(#box)"/>
      <polygon points="120,40 120,100 60,132 60,72" fill="#232833"/>
    </g>
    <g transform="translate(250,250)">
      <polygon points="0,35 52,63 104,35 52,7" fill="#465061"/>
      <polygon points="0,35 0,87 52,115 52,63" fill="url(#box)"/>
      <polygon points="104,35 104,87 52,115 52,63" fill="#282e39"/>
    </g>
  </g>
  <g fill="#7cc4ff" opacity=".85">
    <rect x="700" y="330" width="120" height="9" rx="4"/>
    <rect x="700" y="352" width="80" height="9" rx="4" opacity=".6"/>
    <rect x="700" y="374" width="100" height="9" rx="4" opacity=".35"/>
  </g>
  <text x="480" y="505" font-family="system-ui,sans-serif" font-size="26"
        fill="#8b93a1" text-anchor="middle" letter-spacing="6">ASSETS</text>
</svg>
