<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#0d1016"/>
    </linearGradient>
    <radialGradient id="sphere" cx=".35" cy=".3" r="1">
      <stop offset="0" stop-color="#6f7a8c"/>
      <stop offset=".55" stop-color="#3a4250"/>
      <stop offset="1" stop-color="#1b1f27"/>
    </radialGradient>
    <pattern id="checker" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#232833"/>
      <rect width="20" height="20" fill="#2c313a"/>
      <rect x="20" y="20" width="20" height="20" fill="#2c313a"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#bg)"/>
  <!-- PBR sphere on checker plane -->
  <rect x="180" y="330" width="600" height="120" fill="url(#checker)" opacity=".55"/>
  <ellipse cx="480" cy="452" rx="240" ry="34" fill="#000" opacity=".45"/>
  <circle cx="480" cy="270" r="150" fill="url(#sphere)"/>
  <ellipse cx="420" cy="205" rx="52" ry="30" fill="#dfe3ea" opacity=".25"/>
  <!-- swatch strip -->
  <g transform="translate(660,120)">
    <rect width="70" height="170" rx="8" fill="#8a5a3b"/>
    <rect y="180" width="70" height="22" rx="6" fill="#3a4250"/>
    <text y="196" x="35" font-family="monospace" font-size="12" fill="#dfe3ea" text-anchor="middle">ALB</text>
  </g>
  <g transform="translate(745,120)">
    <rect width="70" height="170" rx="8" fill="#6f7a8c"/>
    <rect y="180" width="70" height="22" rx="6" fill="#3a4250"/>
    <text y="196" x="35" font-family="monospace" font-size="12" fill="#dfe3ea" text-anchor="middle">NRM</text>
  </g>
  <g transform="translate(830,120)">
    <rect width="70" height="170" rx="8" fill="#2c313a"/>
    <rect y="180" width="70" height="22" rx="6" fill="#3a4250"/>
    <text y="196" x="35" font-family="monospace" font-size="12" fill="#dfe3ea" text-anchor="middle">ORM</text>
  </g>
  <text x="480" y="505" font-family="system-ui,sans-serif" font-size="26"
        fill="#8b93a1" text-anchor="middle" letter-spacing="6">TEXTURES</text>
</svg>
