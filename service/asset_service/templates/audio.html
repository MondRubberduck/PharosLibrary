<title>Audio — Library</title><style>
:root{--bg:#14161a;--card:#1e2128;--line:#2c313a;--fg:#dfe3ea;--dim:#8b93a1;--cols:6}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui;background:var(--bg);color:var(--fg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
header a{color:#7cc4ff;text-decoration:none}
h1{font-size:15px;margin:0}
input,select{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 9px}
#wrap{flex:1;display:flex;min-height:0}
#side{width:250px;min-width:250px;border-right:1px solid var(--line);overflow-y:auto;padding:10px 8px}
#side h2{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:10px 8px 6px}
#side h2:first-child{margin-top:2px}
.fbtn{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:none;border:none;
color:var(--fg);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:13px;word-break:break-word}
.fbtn:hover{background:#1c2028}
.fbtn.on{background:#243040;color:#7cc4ff}
.fbtn .n{color:var(--dim);white-space:nowrap}
.fbtn.sub{padding-left:24px;font-size:12px;color:var(--dim)}
.fbtn.sub.on{color:#7cc4ff}
.fbtn .tw{display:inline-block;width:12px;color:var(--dim)}
#main{flex:1;overflow-y:auto;padding:14px}
body.hasbar #main{padding-bottom:74px}
#grid{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;position:relative}
.card:hover{border-color:#3a4250}
.media{aspect-ratio:16/9;background:#0d1015;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.playglyph{width:46px;height:46px;border-radius:50%;background:#243040;border:1px solid #31506e;
display:flex;align-items:center;justify-content:center;color:#7cc4ff;font-size:17px;transition:transform .15s}
.card:hover .playglyph{transform:scale(1.08)}
.card.playing{border-color:#31506e;outline:1px solid #31506e}
.card.paused .playglyph{color:#ffd479}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;visibility:hidden}
.eq i{width:4px;background:#7cc4ff;border-radius:2px;height:6px}
.card.playing .eq{visibility:visible}
.card.playing:not(.paused) .eq i{animation:eqb .7s ease-in-out infinite}
.card.playing .eq i:nth-child(2){animation-delay:.15s}
.card.playing .eq i:nth-child(3){animation-delay:.3s}
.card.playing .eq i:nth-child(4){animation-delay:.45s}
@keyframes eqb{0%,100%{height:5px}50%{height:20px}}
.progwrap{width:100%;height:3px;background:#101216}
.progwrap i{display:block;height:100%;background:#7cc4ff;width:0%}
.badge{position:absolute;top:6px;right:6px;background:rgba(16,18,22,.8);color:var(--dim);
border-radius:10px;padding:1px 8px;font-size:10.5px;z-index:2}
.badge.rel{background:#3d3220;color:#ffd479}
.cap{padding:6px 9px}
.cap .t{word-break:break-word;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:12.5px}
.cap .f{color:var(--dim);font-size:11px;display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pager{display:flex;gap:12px;align-items:center;justify-content:center;padding:16px 0;color:var(--dim)}
#pager button{background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:5px 14px;cursor:pointer}
#pager button:disabled{opacity:.35;cursor:default}
input[type=range]{accent-color:#6ea8fe}
#bseek{flex:1;min-width:160px}
input[type=range]{width:130px}
#bseek{width:auto}
/* bottom player bar */
#pbar{position:fixed;left:0;right:0;bottom:0;display:none;gap:12px;align-items:center;
padding:10px 18px;background:rgba(24,27,33,.97);border-top:1px solid var(--line);z-index:9}
#pbar.show{display:flex}
#pbar .pinfo{min-width:0;flex:0 1 320px}
#pbar .pinfo .t{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar .pinfo .f{color:var(--dim);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pbar button{background:#243040;color:#7cc4ff;border:1px solid #31506e;border-radius:6px;
cursor:pointer;padding:6px 14px;font-size:14px}
#pbar #bseek{flex:1}
#pbar .time{color:var(--dim);font-size:12px;white-space:nowrap}
#pbar .x{background:none;border:none;color:var(--dim);font-size:16px;padding:2px 6px}
input[type=range]{accent-color:#6ea8fe;width:130px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;z-index:10;align-items:center;justify-content:center}
#modal.open{display:flex}
#mbox{width:min(760px,94vw);max-height:92vh;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
#mbox .close{float:right;background:none;border:1px solid var(--line);color:var(--fg);border-radius:6px;cursor:pointer;padding:2px 10px;font-size:15px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
.mrow .chip{background:#2a2f39;border-radius:14px;padding:2px 10px;font-size:12px;color:var(--dim)}
.mrow button.b{background:#243040;color:#7cc4ff;border:1px solid #31506e;border-radius:6px;padding:6px 16px;cursor:pointer;font-size:13px}
#mdesc{color:var(--dim);font-size:12.5px;margin-top:4px}
h2.mt{margin:6px 0 10px;font-size:19px}
</style></head><body>
<header><a href="/">&larr; home</a><h1>Audio</h1>
<input id="q" placeholder="search sounds (e.g. explosion, footsteps, siren) …" size="36">
<div id="tools"><span id="count" style="color:var(--dim)"></span>
<label>tile size <input type="range" id="size" min="3" max="12" step="1"></label></div></header>
<div id="wrap"><div id="side"><h2>Categories — click to expand</h2><div id="tstore"></div></div>
<div id="main"><div id="grid"></div><div id="pager">
<button id="prev">&lsaquo; prev</button><span id="pg"></span><button id="next">next &rsaquo;</button></div></div></div>
<div id="pbar">
 <button id="bplay">▶</button>
 <div class="pinfo"><div class="t" id="btitle">—</div><div class="f" id="bsub"></div></div>
 <input type="range" id="bseek" min="0" max="1000" value="0">
 <span class="time" id="btime">0:00</span>
 <button id="bexp" class="x" title="show file in Explorer">&#128193;</button>
 <button id="bx" class="x" title="stop and hide">✕</button>
</div>
<div id="modal"><div id="mbox">
<button class="close" id="mclose">✕</button>
<h2 class="mt" id="mname"></h2>
<div class="mrow" id="mchips"></div>
<div class="mrow"><button class="b" id="mplay">▶ play</button></div>
<div id="mdesc"></div>
<div class="mrow" id="mact"></div>
<div id="mtags"></div>
</div></div>
<script>
const $=id=>document.getElementById(id);
const qBox=$('q'),sizeEl=$('size');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let q='',page=1,total=0;
let fCat='',fSub='';
let openCats=[];
let cols=parseInt(localStorage.getItem('audCols')||'6');sizeEl.value=cols;
document.documentElement.style.setProperty('--cols',cols);
const fmt=s=>{if(!isFinite(s))return'–:–';s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0');};
const pageSize=()=>{
 const gw=document.getElementById('main').clientWidth-28;
 const cw=(gw-(cols-1)*12)/cols;
 const rowH=cw*9/16+42+12;
 const rows=Math.max(4,Math.floor((document.getElementById('main').clientHeight-28)/rowH));
 return cols*rows;};

// ---------------- single global streaming player ----------------
// Streams via /audiofile (HTTP Range) — no blobs, instant switching.
const A=new Audio(); A.preload='none';
let curId=null,curCard=null;
function cardById(id){return grid.querySelector(`.card[data-id="${id}"]`);}
function setCardUI(card,playing,paused){
 if(!card)return;
 card.classList.toggle('playing',playing);
 card.classList.toggle('paused',!!paused);
 const g=card.querySelector('.playglyph');if(g)g.textContent=playing?(paused?'▶':'❚❚'):'▶';
 if(!playing){const pw=card.querySelector('.progwrap i');if(pw)pw.style.width='0%';}}
function updateBar(){
 if(!curId)return;
 $('bplay').textContent=A.paused?'▶':'❚❚';
 if(A.duration){$('bseek').value=Math.round(A.currentTime/A.duration*1000);
  $('btime').textContent=fmt(A.currentTime)+' / '+fmt(A.duration);}
 const pw=curCard?curCard.querySelector('.progwrap i'):null;
 if(pw&&A.duration)pw.style.width=Math.min(100,A.currentTime/A.duration*100)+'%';}
function stopAll(){
 A.pause();A.removeAttribute('src');A.load();
 if(curCard)setCardUI(curCard,false);
 curId=null;curCard=null;
 $('pbar').classList.remove('show');document.body.classList.remove('hasbar');}
function playItem(card,item){
 if(curId===item.id){
  if(A.paused){A.play().catch(e=>fail(card,e));}
  else{A.pause();}
  return;}
 stopAll();
 if(!item.playable){card&&setCardUI(card,false);
  $('btitle').textContent='.'+item.ext+' cannot play in browser';
  $('bsub').textContent=item.rel||'';
  $('pbar').classList.add('show');document.body.classList.add('hasbar');
  $('bplay').textContent='⨯';A.removeAttribute('src');curId=item.id;curCard=card;return;}
 A.src='/audiofile?path='+encodeURIComponent(item.rel);
 curId=item.id;curCard=card||cardById(item.id);
 setCardUI(curCard,true,false);
 $('btitle').textContent=item.name||item.rel.split('/').pop();
 $('bsub').textContent=[item.cat,item.sub].filter(Boolean).join(' · ');
 $('pbar').classList.add('show');document.body.classList.add('hasbar');
 A.play().catch(e=>fail(card,e));}
function fail(card,e){
 if(curCard)setCardUI(curCard,false);
 $('bplay').textContent='⨯';
 $('btime').textContent='playback error: '+((e&&e.message)||e);}
A.addEventListener('play',()=>{updateBar();});
A.addEventListener('pause',()=>{updateBar();
 if(curCard)setCardUI(curCard,true,true);});
A.addEventListener('ended',()=>{if(curCard)setCardUI(curCard,false);
 $('bplay').textContent='▶';if($('bseek'))$('bseek').value=0;});
A.addEventListener('timeupdate',updateBar);
A.addEventListener('error',()=>{if(curId)fail(curCard,new Error('audio stream error'));});
$('bplay').onclick=()=>{if(curId===null)return;
 if(A.paused)A.play().catch(e=>fail(curCard,e));else A.pause();};
$('bseek').oninput=()=>{if(A.duration)A.currentTime=$('bseek').value/1000*A.duration;};
$('bexp').onclick=()=>{if(curId===null)return;
 const card=cardById(curId);
 const rel=card?card.dataset.rel:null;
 if(!rel){return;}
 fetch('/api/open_explorer?path='+encodeURIComponent(rel))
  .then(r=>r.json().then(j=>({ok:r.status===200,j})))
  .then(({ok,j})=>{$('bexp').textContent=ok?'✓':'⨯';
    setTimeout(()=>{$('bexp').textContent='📁';},1200);});};
$('bx').onclick=()=>stopAll();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target.tagName!=='INPUT'&&curId!==null){
 e.preventDefault();if(A.paused)A.play().catch(()=>{});else A.pause();}});

function openExplorer(path,btn){
 if(btn){btn.dataset.orig=btn.innerHTML;btn.disabled=true;}
 fetch('/api/open_explorer?path='+encodeURIComponent(path))
  .then(r=>r.json().then(j=>({ok:r.status===200,j})))
  .then(({ok,j})=>{if(btn){btn.disabled=false;
    btn.innerHTML=ok?'opened ✓':('failed: '+(j.error||'?'));
    if(ok)setTimeout(()=>{btn.innerHTML=btn.dataset.orig;},1500);}})
  .catch(e=>{if(btn){btn.disabled=false;btn.innerHTML='failed';}});}
document.addEventListener('click',e=>{const b=e.target.closest('#mexp');
 if(b)openExplorer(b.dataset.p,b);});
async function loadTree(){
 const d=await(await fetch('/api/audio/tree')).json();
 let h=`<button class="fbtn${!fCat&&!fSub?' on':''}" data-all="1">All sounds <span class="n">${d.total}</span></button>`;
 for(const c of d.cats){
  const open=fCat===c.name||openCats.includes(c.name);
  h+=`<button class="fbtn${fCat===c.name&&!fSub?' on':''}" data-c="${esc(c.name)}" title="${esc(c.desc||'')}"><span class="tw">${open?'▾':'▸'}</span> ${esc(c.name)} <span class="n">${c.n}</span></button>`;
  if(open)h+=c.subs.map(s=>`<button class="fbtn sub${fSub===s.name&&fCat===c.name?' on':''}" data-c="${esc(c.name)}" data-s="${esc(s.name)}">↳ ${esc(s.name)} <span class="n">${s.n}</span></button>`).join('');}
 tstore.innerHTML=h;}
tstore.onclick=e=>{const b=e.target.closest('.fbtn');if(!b)return;
 if(b.dataset.all){fCat='';fSub='';page=1;loadTree();load();return;}
 const c=b.dataset.c;
 if(b.dataset.s!==undefined&&b.dataset.s!==''){fCat=c;fSub=b.dataset.s;page=1;loadTree();load();return;}
 fCat=(fCat===c)?'':c;fSub='';
 const i=openCats.indexOf(c);if(i>=0)openCats.splice(i,1);else openCats.push(c);
 page=1;loadTree();load();};
async function load(){
 const p=new URLSearchParams({q,page,size:pageSize()});
 if(fCat)p.set('cat',fCat);
 if(fSub)p.set('sub',fSub);
 let d;try{d=await(await fetch('/api/audio/items?'+p)).json();}catch(e){grid.innerHTML='';count.textContent='load failed';return;}
 total=d.total;page=d.page;
 count.textContent=`${d.total} sound(s)`;
 grid.innerHTML=d.items.map(c=>{
  const badge=d.q&&c.tier===3?`<span class="badge rel">related</span>`:'';
  const glyph=!c.playable?'⨯':'▶';
  const isCur=c.id===curId;
  return `<div class="card${isCur?' playing':''}${isCur&&A.paused?' paused':''}" data-id="${c.id}" data-rel="${esc(c.rel)}" data-playable="${c.playable}">
   ${badge}
   <div class="media"><div class="playglyph">${isCur?(A.paused?'▶':'❚❚'):glyph}</div><div class="eq"><i></i><i></i><i></i><i></i></div></div>
   <div class="progwrap"><i></i></div>
   <div class="cap"><span class="t" title="${esc(c.rel)}">${esc(c.name)}</span>
   <span class="f">${esc(c.cat)} · ${esc(c.sub||'')} · ${c.dur?fmt(c.dur):'?'}</span></div></div>`;}).join('');
 // re-bind current card after re-render
 if(curId!==null){curCard=cardById(curId);
  if(curCard)setCardUI(curCard,true,A.paused);}
 pg.textContent=`page ${d.page} / ${Math.max(1,Math.ceil(total/pageSize()))}`;
 prev.disabled=page<=1;next.disabled=page>=Math.ceil(total/pageSize());}
grid.onclick=e=>{const card=e.target.closest('.card');if(!card)return;
 playItem(card,{id:+card.dataset.id,rel:card.dataset.rel,
   playable:card.dataset.playable==='1',
   name:card.querySelector('.t')?.textContent||'',
   cat:card.querySelector('.f')?.textContent.split(' · ')[0]||''});};
prev.onclick=()=>{if(page>1){page--;load();main.scrollTop=0;}};
next.onclick=()=>{if(page<Math.ceil(total/pageSize())){page++;load();main.scrollTop=0;}};
qBox.oninput=()=>{clearTimeout(window._t);window._t=setTimeout(()=>{q=qBox.value.trim();page=1;load();},250);};
sizeEl.oninput=()=>{cols=parseInt(sizeEl.value);localStorage.setItem('audCols',cols);
 document.documentElement.style.setProperty('--cols',cols);page=1;
 clearTimeout(window._s);window._s=setTimeout(load,250);};
addEventListener('resize',()=>{clearTimeout(window._r);window._r=setTimeout(load,300);});
async function openItem(id){
 const d=await(await fetch('/api/audio/item?id='+id)).json();
 if(d.error)return;
 const it=d.item;
 $('mname').textContent=it.name;
 const bits=[it.cat,it.sub];
 if(it.dur)bits.push(fmt(it.dur));
 if(it.sr)bits.push((it.sr/1000)+' kHz'+(it.ch?' · '+(it.ch>1?'stereo':'mono'):''));
 if(it.ext)bits.push('.'+it.ext);
 $('mchips').innerHTML=bits.map(b=>`<span class="chip">${esc(b)}</span>`).join('');
 $('mdesc').textContent=it.desc||'';
 let act='';
 if(it.playable)act+=`<button class="b" id="mplay">▶ play / ❚❚ pause</button>`;
 act+=`<button class="b" id="mcopy" data-copy="${esc(it.relfull)}">copy file path</button>`;
 if(it.relfull)act+=`<button class="b" id="mexp" data-p="${esc(it.relfull)}">show in Explorer &#8599;</button>`;
 $('mact').innerHTML=act;
 const mp=$('mplay');
 if(mp)mp.onclick=()=>{
  const card=cardById(it.id);
  if(card){setCardUI(card,true,false);
   playItem(card,{id:it.id,rel:it.rel,playable:it.playable,name:it.name,cat:it.cat,sub:it.sub});}
  else{playItem(null,{id:it.id,rel:it.rel,playable:it.playable,name:it.name,cat:it.cat,sub:it.sub});}
  $('btitle').textContent=it.name;$('bsub').textContent=[it.cat,it.sub].filter(Boolean).join(' · ');};
 const cp=$('mcopy');
 if(cp)cp.onclick=()=>{if(navigator.clipboard)navigator.clipboard.writeText(cp.dataset.copy).then(()=>{
   cp.textContent='copied ✓';setTimeout(()=>cp.textContent='copy file path',1500);});};
 let tags=[];
 try{tags=Array.isArray(it.tags)?it.tags:JSON.parse(it.tags||'[]');}catch(e){}
 $('mtags').innerHTML=tags.length?('<span style="color:var(--dim);font-size:11.5px;margin-right:4px">tags:</span>'+
   tags.slice(0,14).map(t=>`<span class="tag">${esc(t)}</span>`).join('')):'';
 $('modal').classList.add('open');}
$('mclose').onclick=()=>$('modal').classList.remove('open');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('open');});
addEventListener('keydown',e=>{if(e.key==='Escape')$('modal').classList.remove('open');});
loadTree();load();
</script></body></html>
